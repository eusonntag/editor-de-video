name: Teste de instalação e pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  teste:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: FFmpeg (Mac)
        if: runner.os == 'macOS'
        run: brew install ffmpeg-full

      - name: Diagnóstico antes da instalação
        run: python editor.py diagnostico

      - name: Instalar o editor
        run: python editor.py instalar

      - name: Diagnóstico depois da instalação
        run: python editor.py diagnostico --json

      - name: Pipeline completo com o vídeo de exemplo
        run: python editor.py exemplo

      - name: Busca de ícones em português
        run: python editor.py icones buscar "vendas dinheiro"

      - name: Resultado
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: exemplo-${{ matrix.os }}
          path: |
            videos/Editados/exemplo_editado.mp4
            videos/.trabalho/_exemplo/verificacao.jpg
            videos/.trabalho/_exemplo/motion/horizontal/montagem.json
          if-no-files-found: warn
